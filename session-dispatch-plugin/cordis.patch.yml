# 本 bundle 贡献给 profile 的配置层 / The configuration layer this bundle contributes.
#
# profile 按顺序叠加它的 bundles；当 `package.json` 的 `dsh.profile.bundles` 列出
# "dsh-session-dispatch" 时本层生效。
# A profile stacks its bundles in order; this layer applies when the profile lists
# "dsh-session-dispatch" in package.json -> dsh.profile.bundles.
#
# `insert` 追加一行插件 / `insert` appends one plugin row:
#   id      - 行 id，其它 patch 层按它覆盖 / unique row id other patch layers target
#   name    - 插件包名，由 Node 从 profile 解析 / the plugin package specifier
#   config  - 在 `apply` 之前由插件的 Config 校验（@deepseek-ai/schemastery）/ validated by the plugin's Config
#
# 覆盖示例（按 id 覆盖时 config 是整体替换，不是深合并，所以要重述每个想保留的字段）:
# Override example (a patch by id replaces the whole `config`, never deep-merges,
# so restate every field that must stay):
#
#   - id: session-dispatch
#     name: 'dsh-session-dispatch'
#     config:
#       reportTemplate: "DONE {target_session_id}\n\n{output}"
#       maxReportChars: 2000
- insert:
    - id: session-dispatch
      name: 'dsh-session-dispatch'
      config:
        # 回报正文模板；必须保留 {target_session_id} 与 {output}，否则加载期即报错。
        # Report body template; must keep {target_session_id} and {output} or loading fails.
        reportTemplate: |-
          [SESSION DISPATCH REPORT]
          Target session: {target_session_id}
          Watch: {watch_id}
          Outcome: {outcome} (waited {waited_ms} ms)

          {output}
        # 目标没有 assistant 文本时替换 {output} 的正文 / stand-in body for {output}.
        emptyOutputText: '(the dispatched session produced no assistant text)'
        # 回报正文长度上限（字符）/ character cap for the reported output.
        maxReportChars: 4000
        # 同时挂起的看守上限 / cap on concurrently armed watches.
        maxConcurrentWatches: 64
