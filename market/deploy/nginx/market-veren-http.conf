# market.veren.top — ACME 挑战与 http -> https 跳转 / ACME challenge and http -> https redirect
# 与 dsh.veren.top 同机，证书由 certbot webroot 模式签发。
# Same host as dsh.veren.top; the certificate is issued by certbot in webroot mode.
server {
    listen 80;
    listen [::]:80;
    server_name market.veren.top;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
