# market.veren.top — DSH 插件市场索引源的静态站点 / Static site of the DSH plugin market index source
# 目录 /var/www/market 由仓库的 `pnpm market:deploy` 同步；本站点匿名只读，不要加鉴权，
# 因为 Discover 由 DSH Host 直接抓取，不带任何用户凭据。
# The /var/www/market directory is synced by the repository's `pnpm market:deploy`; this site is
# anonymous read-only on purpose: Discover fetches the index from the DSH Host without user credentials.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name market.veren.top;

    ssl_certificate     /etc/letsencrypt/live/market.veren.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market.veren.top/privkey.pem;

    root /var/www/market;
    index index.json;
    charset utf-8;

    access_log /var/log/nginx/market-veren-access.log;
    error_log  /var/log/nginx/market-veren-error.log;

    # 索引会随发版变化，禁止任何中间层缓存 / The index changes with releases, so forbid intermediate caching.
    location = /index.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 图标按文件名区分内容，可以长缓存 / Icons are content-addressed by file name and cache long.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
