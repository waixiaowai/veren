packages:
  - "packages/*"
  - "packages/compiler/*"
  - "packages/commander/*"
  - "packages/graph/*"
  # graph-bundle 是安装件而非可安装单元：它自带 tarballs/，其内部依赖是
  # `pnpm pack` 改写出的裸版本号，只有目标 profile 的 overrides 才能解析；
  # 留在工作区内会让根 `pnpm install` 去 registry 找 @veren/*（404）。
  # graph-bundle is a shipping artifact, not an installable unit: it carries its
  # own tarballs/ whose inner dependencies are the bare versions `pnpm pack`
  # rewrites, resolvable only by the target profile's overrides; keeping it in
  # the workspace makes a root `pnpm install` hit the registry for @veren/*.
  - "!packages/graph/bundle"
  # commander/profile 是 DSH profile 模板，不是 npm 单元；安装脚本把它复制到
  # $DSH_HOME/profiles/commander，工作区安装不应把它当成包。
  # commander/profile is a DSH profile template, not an npm unit; the installer
  # copies it into $DSH_HOME/profiles/commander, so workspace install must skip it.
  - "!packages/commander/profile"
  # plugins/admin 是一个分组目录，下面的每个包各自是一个可安装单元；只写
  # `plugins/*` 匹配不到 `plugins/admin/kernel` 这一层，它们会静默不进工作区，
  # 于是既不安装依赖也不构建不测试。
  # plugins/admin is a group directory whose members are each an installable
  # unit; `plugins/*` alone misses `plugins/admin/kernel` one level down, so
  # those packages silently stay outside the workspace — no dependency install,
  # no build, no tests.
  - "plugins/*"
  - "plugins/*/*"
  # providers 是第三层（plugins/admin/providers/<provider>），同样只靠上面两条匹配不到。
  # providers are a third level (plugins/admin/providers/<provider>); the two
  # globs above still miss them.
  - "plugins/*/*/*"
  - "apps/*"
  # 编译器外部扩展测试：必须位于 packages/ 之外，验证包入口导出与文档里的继承姿势。
  # External compiler-extension test: outside packages/ on purpose, proving the
  # public entry exports and the documented subclassing pattern.
  - "tests/*"
  - "!apps/veren"
  - "vendor/*"