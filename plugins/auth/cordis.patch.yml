# Example profile overlay for the auth-framework login gate.
# 认证框架登录门禁的 profile overlay 示例。
#
# Apply on top of the web profile:  dsh web --patch plugins/auth/cordis.patch.yml
# 在 web profile 之上叠加：        dsh web --patch plugins/auth/cordis.patch.yml

# The gate itself. `distIndex` is resolved by the plugin from the running
# runtime's `@deepseek-ai/dsh-web-frontend` package, so packaged desktops,
# source checkouts, and test nodes all work without a deployment path. Set it
# explicitly only when the deployment replaces that frontend. The sqlite
# database file defaults to `<DSH_HOME>/storages/web_login_gate/auth.db` and
# can be moved with `database.file`.
# 门禁本体。`distIndex` 由插件从运行中 runtime 的 `@deepseek-ai/dsh-web-frontend`
# 包解析，因此打包桌面端、源码检出与测试节点都无需部署路径即可工作。仅在部署
# 替换该前端时显式设置。sqlite 数据库文件默认位于
# `<DSH_HOME>/storages/web_login_gate/auth.db`，可用 `database.file` 迁移。
- insert:
    - id: web-login-gate
      name: '@veren/web-login-gate'
      config:
        sessionDays: 7
        rateLimit:
          window: 60
          max: 10
        # First-run administrator seed. Consumed once: only the scrypt hash is
        # stored, so this block can be removed after the first boot.
        # 首次运行管理员种子。只消费一次：落库的只有 scrypt 哈希，首次启动后
        # 即可删除本段。
        admin:
          email: admin@example.com
          password: change-me-please
          name: Administrator
