<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Startup Autostart">
  <defs>
    <linearGradient id="sa-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d7dff"/>
      <stop offset="1" stop-color="#1b4bd8"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sa-body)"/>
