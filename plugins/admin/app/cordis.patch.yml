# Admin platform bundle: composes the whole P0 stack in one profile layer.
# 后台平台组合包：用一个 profile 层装好 P0 全套。
#
# This bundle is the ONLY profile layer of the admin stack: no member package
# declares `dsh.bundle.patch`, so dsh plugin reconciliation activates exactly
# this layer and installing the bundle can never double-insert a row. Each
# member rides along as a plain dependency of this bundle.
# 本组合包是后台技术栈唯一的 profile 层：没有成员包声明 `dsh.bundle.patch`，
# 因此 dsh plugin 的 reconciliation 只会激活这一层，安装组合包绝不会重复插行。
# 各成员作为本组合包的普通依赖随行。
#
# Row order is a dependency order, not a preference:
#   kernel → gateway → data/access → auth → nav/audit/docs → ui → web
# The web row injects `adminReadiness`, which the kernel publishes only after
# every essential capability has a provider, so it activates after the provider
# rows even when the loader mounts rows concurrently.
# 行顺序是依赖顺序而非偏好：内核 → 网关 → 数据/授权 → 认证 → 导航/审计/文档 →
# UI → Web。Web 行注入 `adminReadiness`，内核只在全部必需能力都有 provider 后才发布
# 它，因此即使 loader 并发挂载各行，Web 行也会在 provider 行之后激活。
- insert:
    # Capability registry, version negotiation, façades and the boot gate.
    # 能力注册表、版本协商、façade 与启动门禁。
    - id: admin-kernel
      name: '@veren/admin-kernel'

    # Unified HTTP gateway: auth, permissions, CSRF, audit, OpenAPI.
    # 统一 HTTP 网关：认证、权限、CSRF、审计、OpenAPI。
    - id: admin-api-kernel
      name: '@veren/admin-api-kernel'

    # Recommended production `data` provider: PostgreSQL. Connection values come
    # from profile config (`host`, `port`, `user`, `password`, `database`,
    # optionally `schema`/`ssl`/`maxConnections`); the package holds no
    # credentials. The schema bootstraps idempotently on load.
    # 推荐的生产 `data` provider：PostgreSQL。连接值来自 profile 配置（`host`、
    # `port`、`user`、`password`、`database`，可选 `schema`/`ssl`/`maxConnections`）；
    # 包内不含凭据。schema 在加载时幂等引导。
    - id: admin-data-postgres
      name: '@veren/admin-data-postgres'

    # Embedded fallback over the DSH storage domain (JSON backend). Enable this
    # row and disable the PostgreSQL row to run without an external database;
    # it needs a `storage` group and `storageDomain` in the profile.
    # 基于 DSH storage domain（JSON 后端）的嵌入回退。禁用 PostgreSQL 行并启用本行
    # 即可在没有外部数据库时运行；它需要 profile 提供 `storage` 组与 `storageDomain`。
    - id: admin-data-dsh-kv
      name: '@veren/admin-data-dsh-kv'
      disabled: true
      config:
        storage:
          backend: json

    # `access`: role catalog, bindings, anti-lockout.
    # `access`：角色目录、绑定、防自锁。
    - id: admin-access-rbac
      name: '@veren/admin-access-rbac'

    # `auth`: first-run setup, sign-in, sessions, users, API tokens.
    # `auth`：首次初始化、登录、会话、用户、API token。
    - id: admin-auth-local
      name: '@veren/admin-auth-local'

    # `navigation`: the default menu contributions.
    # `navigation`：默认菜单贡献。
    - id: admin-navigation-default
      name: '@veren/admin-navigation-default'

    # `audit`: append-only trail with retention and cursor paging.
    # `audit`：带保留策略与游标分页的只追加轨迹。
    - id: admin-audit-default
      name: '@veren/admin-audit-default'

    # `docs`: capability catalog, backend health, OpenAPI and docs index.
    # `docs`：能力目录、后端健康、OpenAPI 与文档索引。
    - id: admin-docs-openapi
      name: '@veren/admin-docs-openapi'

    # Browser UI runtime: pack registry and per-audience manifests.
    # 浏览器 UI 运行时：包注册表与按受众的清单。
    - id: admin-ui-kernel
      name: '@veren/admin-ui-kernel'

    # Default packs; disable a row and enable another pack to replace it.
    # 默认包；禁用一个行并启用另一个包即可替换。
    - id: admin-theme-default
      name: '@veren/admin-theme-default'
    - id: admin-locale-zh-en
      name: '@veren/admin-locale-zh-en'
    - id: admin-icons-default
      name: '@veren/admin-icons-default'
    - id: admin-shell-default
      name: '@veren/admin-shell-default'

    # SPA carrier: shell, assets, UI pack files, bootstrap, boot gate.
    # SPA 载体：壳、资源、UI 包文件、bootstrap、启动门禁。
    - id: admin-web
      name: '@veren/admin-web'
