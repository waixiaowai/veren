apiVersion: v1
kind: Secret
metadata:
  name: '{{ .Release.Name }}-app'
  namespace: '{{ .Release.Namespace }}'
  # Survive upgrades so the agent's credentials and history stay stable.
  # 升级时保留，让智能体的凭据与历史保持稳定。
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OPENCODE_GO_API_KEY: {{ .Values.olaresEnv.OPENCODE_GO_API_KEY | toJson }}
  GITEA_URL: {{ .Values.olaresEnv.GITEA_URL | toJson }}
  GITEA_TOKEN: {{ .Values.olaresEnv.GITEA_TOKEN | toJson }}
  GITEA_LOGIN: {{ .Values.olaresEnv.GITEA_LOGIN | toJson }}
