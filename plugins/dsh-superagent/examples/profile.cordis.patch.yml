# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# The bundle wires only the CMS task-router worker Source; enable its row and set url, token and nodeId:
# - id: dsh-superagent-taskhub
#   disabled: false
# The GitHub, Gitea and Feishu Source kinds still ship in this package. To use one, insert its own row in this file, for example:
# - insert:
#     - id: dsh-superagent-github
#       name: dsh-superagent/github-watch
