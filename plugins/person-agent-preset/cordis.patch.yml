# Person Agent preset profile overlay: inserts the preset plugin row.
# Person Agent 预设的 profile overlay：插入预设插件行。
#
# Config matches the plugin's Config schema (presetId / order / withWeb);
# the registry mounts the declared child rows per session.
# config 与插件 Config schema 对应（presetId / order / withWeb）；注册表按
# 会话挂载声明的子行。
- insert:
    - id: person-agent-preset
      name: '@veren/person-agent-preset'
      config:
        presetId: person-agent
        order: 5
        withWeb: true
