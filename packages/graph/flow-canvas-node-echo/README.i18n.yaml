# 文档语言索引与使用说明 / documentation language index and usage guide
package: "@deepseek-ai/dsh-graph-flow-canvas-node-echo"
default: en

readme:
  en: README.md
  zh: README.cn.md

# 怎么用这份双语文档 / how to use this bilingual documentation
how-to-use:
  en:
    - "Read README.md first: it is the English source of truth for this demo plugin."
    - "Open README.cn.md for the Chinese version of the same content."
    - "Install it only beside the Flow canvas panel; uninstalling proves the default-card fallback."
    - "When editing either side, mirror the change, keep code blocks identical, and update reviewed."
  zh:
    - "先读 README.md：它是本演示插件英文内容的事实来源。"
    - "中文看 README.cn.md，内容与英文一一对应。"
    - "只在 Flow 画布面板旁边安装它；卸载它即可验证默认卡片回落。"
    - "修改任一侧时同步另一侧，保持代码块一致，并更新 reviewed。"

scope:
  en: "One keyed `flow.canvas.node` renderer for the `echo` node type plus its locale dictionary. It has no Host code, transport or state; it exists to demonstrate and test the panel's per-node-type extension point."
  zh: "只提供 `echo` 节点类型的 keyed `flow.canvas.node` 渲染器及其语言词典。它没有宿主代码、传输或状态；用于演示并测试面板的按节点类型扩展点。"

naming:
  en: "This repository uses README.cn.md for Chinese; README.zh.md is not used (AGENTS.md convention)."
  zh: "本仓库中文文件用 README.cn.md；不使用 README.zh.md（AGENTS.md 约定）。"

reviewed: "2026-10-18"
