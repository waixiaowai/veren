# 文档语言索引与使用说明 / documentation language index and usage guide
package: "@deepseek-ai/dsh-graph-flow-canvas-panel"
default: en

readme:
  en: README.md
  zh: README.cn.md

# 怎么用这份双语文档 / how to use this bilingual documentation
how-to-use:
  en:
    - "Read README.md first: it is the English source of truth for this plugin."
    - "Open README.cn.md for the Chinese version of the same content."
    - "Follow Install, then Verification; the commands are copy-paste runnable."
    - "When editing either side, mirror the change, keep code blocks identical, and update reviewed."
  zh:
    - "先读 README.md：它是本插件英文内容的事实来源。"
    - "中文看 README.cn.md，内容与英文一一对应。"
    - "按 Install、Verification 小节的顺序执行；命令可直接复制运行。"
    - "修改任一侧时同步另一侧，保持代码块一致，并更新 reviewed。"

scope:
  en: "The Flow canvas Web page plus the Host Remote adapter: main-panel rendering, pan/zoom/fit viewport, live run subscription, approval dock, node-output inspector, locale, and the keyed `flow.canvas.node` renderer extension point. The graph data plane stays in @deepseek-ai/dsh-graph-flow-canvas; editing, drag/drop, multi-select, minimap and layout persistence are out of scope."
  zh: "Flow 画布 Web 页面 + 宿主 Remote 适配层：主面板渲染、平移/缩放/适应屏幕视口、运行订阅、授权坞、节点 output 检查器、多语言，以及 keyed `flow.canvas.node` 渲染器扩展点。graph 数据面仍在 @deepseek-ai/dsh-graph-flow-canvas；编辑、拖拽、多选、小地图与布局持久化不在范围内。"

naming:
  en: "This repository uses README.cn.md for Chinese; README.zh.md is not used (AGENTS.md convention)."
  zh: "本仓库中文文件用 README.cn.md；不使用 README.zh.md（AGENTS.md 约定）。"

reviewed: "2026-10-18"
