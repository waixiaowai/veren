{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "gitea-web-svc",
    "namespace": {{ .Release.Namespace | quote }}
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "gitea"
    },
    "ports": [
      {
        "name": "maintenance",
        "port": 8080,
        "targetPort": 8080
      }
    ]
  }
}
