{{- if not .Values.runtimeEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-receiver-preflight-20261029-code
  namespace: {{ .Release.Namespace }}
immutable: true
data:
{{- range $name := list "receiver.py" "tests.py" "preflight.py" "requirements.lock" }}
  {{ $name }}: |
{{ $.Files.Get (printf "files/%s" $name) | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-receiver-preflight-20261029
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        migration.gitea.local/receiver-run: {{ .Values.previousReceiver.runId | quote }}
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      dnsPolicy: None
      dnsConfig:
        nameservers: [{{ .Values.previousReceiver.dnsResolverIPv4 | quote }}]
        searches: []
        options: [{name: ndots, value: "1"}, {name: timeout, value: "2"}, {name: attempts, value: "2"}]
      containers:
        - name: preflight
          image: {{ .Values.previousReceiver.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/python3, -B, /receiver/preflight.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: HOME, value: /tmp}
            - {name: TMPDIR, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: code, mountPath: /receiver, readOnly: true}
            - {name: wheels, mountPath: /wheels, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap: {name: gitea-receiver-preflight-20261029-code, defaultMode: 0444}
        - name: wheels
          hostPath:
            path: {{ printf "%s/postgres-restore-candidate/%s/wheels" .Values.userspace.appData .Values.previousReceiver.runtimeSubPath | quote }}
            type: Directory
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 512Mi}

{{- end }}
