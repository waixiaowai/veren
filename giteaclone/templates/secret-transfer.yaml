{{- if not .Values.runtimeEnabled }}
{{- if and .Values.secretTransfer .Values.secretTransfer.enabled }}
{{- $script := required "secret target script required" (.Files.Get "files/secret-target.py") -}}
{{- if ne (sha256sum $script) .Values.secretTransfer.scriptSha256 }}{{ fail "secret script hash mismatch" }}{{ end -}}
{{- $feed := required "encrypted secret feed required" (.Files.Get "files/secret-feed.json") -}}
{{- if ne (sha256sum $feed) .Values.secretTransfer.feedSha256 }}{{ fail "encrypted feed hash mismatch" }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-secret-transfer-v2-code
  namespace: {{ .Release.Namespace }}
immutable: true
data:
  secret-target.py: |
{{ $script | indent 4 }}
  secret-feed.json: |
{{ $feed | indent 4 }}
  requirements.lock: |
{{ .Files.Get "files/requirements.lock" | indent 4 }}
  bootstrap.py: |
    import os,subprocess,sys,resource
    os.umask(0o077)
    resource.setrlimit(resource.RLIMIT_CORE,(0,0))
    subprocess.run([sys.executable,'-B','-m','pip','--isolated','install','--no-index','--find-links','/wheels','--target','/runtime/vendor','--require-hashes','--only-binary=:all:','--no-deps','--no-compile','--no-cache-dir','--disable-pip-version-check','-r','/receiver/requirements.lock'],check=True)
    os.environ['PYTHONPATH']='/runtime/vendor'
    os.execv(sys.executable,[sys.executable,'-B','/receiver/secret-target.py'])
---
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: gitea-secret-transfer-v2-egress
  namespace: {{ .Release.Namespace }}
spec:
  tier: default
  order: 90
  selector: "migration.gitea.local/secret-run == 'gitea-secret-20261029-f07c219d6eab-v2'"
  types: [Ingress, Egress]
  ingress: [{action: Deny}]
  egress:
    - action: Allow
      protocol: TCP
      destination:
        nets: [122.228.29.101/32]
        ports: [443]
    - action: Deny
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-secret-transfer-v2
  namespace: {{ .Release.Namespace }}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        migration.gitea.local/secret-run: gitea-secret-20261029-f07c219d6eab-v2
      annotations:
        config.linkerd.io/proxy-await: disabled
        config.linkerd.io/skip-outbound-ports: "443"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      nodeSelector: {kubernetes.io/hostname: olares-worker, kubernetes.io/arch: amd64}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: secret-transfer
          image: {{ .Values.receiver.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/python3, -B, /receiver/bootstrap.py]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: PYTHONPATH, value: /runtime/vendor}
            - {name: HOME, value: /runtime}
            - {name: TMPDIR, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: code, mountPath: /receiver, readOnly: true}
            - {name: transport, mountPath: /secret-transfer}
            - {name: wheels, mountPath: /wheels, readOnly: true}
            - {name: runtime, mountPath: /runtime}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap: {name: gitea-secret-transfer-v2-code, defaultMode: 0444}
        - name: transport
          hostPath:
            path: {{ printf "%s/postgres-restore-candidate/incoming-production-1d3e6c9b862a4822a839886a374fd9b0/secret-transfer-gitea-secret-20261029-f07c219d6eab" .Values.userspace.appData | quote }}
            type: Directory
        - name: wheels
          hostPath:
            path: {{ printf "%s/postgres-restore-candidate/receiver-runtime-33a5d0d3c912150caaa9a62c8346b23b/wheels" .Values.userspace.appData | quote }}
            type: Directory
        - name: runtime
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
{{- end }}

{{- end }}
